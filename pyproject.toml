[project]
name = "stress"
version = "0.1.0"
description = "Nifty 50 Market Stress Monitor data pipeline"
requires-python = ">=3.11"
dependencies = [
    "azure-storage-blob>=12.31.1",
    "duckdb>=1.1.0",
    "matplotlib>=3.11.2",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "streamlit>=1.67.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stress"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
link-mode = "copy"
